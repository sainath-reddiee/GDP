# One Snowflake environment for `python infrastructure/deploy.py --env <name>`.
# Copy this file to <name>.toml (for example client-prod.toml). Real environment files are not committed (.gitignore):
# they name the client's account and roles. Never put a password here.

[snowflake]
# Either a connection name from ~/.snowflake/connections.toml ...
connection = "client-prod"
# ... or the account and user directly (SSO through the browser by default):
# account = "orgname-accountname"
# user = "FIRST.LAST@CLIENT.COM"
# authenticator = "externalbrowser"        # or "snowflake_jwt" with private_key_file = "C:/keys/deploy.p8"

role = "AODS_PLATFORM_ADMIN"              # the account role you deploy with (owns the platform database)
warehouse = "AI_PLATFORM_WH"
database = "AI_PLATFORM"

[access]
# account_roles: no database roles. Your role administrator creates ten account roles <role_prefix>_* once
# (AODS_PLATFORM_ADMIN, AODS_DATA_ENGINEER, AODS_DATA_STEWARD, AODS_DOMAIN_OWNER, AODS_QA_ENGINEER, AODS_REVIEWER,
# AODS_VIEWER, AODS_OPS_SERVICE, AODS_OPS_VIEWER, AODS_SERVICE_AGENT) and gives them to people; --admin-sql writes
# that SQL. The deploy grants every privilege to them directly. Use a prefix such as AODS_PROD when two environments
# share one Snowflake account.
model = "account_roles"
role_prefix = "AODS"
# database_roles instead: the platform creates database roles <db>.DATA_ENGINEER, ... and grants them to the account
# roles you list here, for example:
# model = "database_roles"
# DATA_ENGINEER = ["MY_ENGINEER_ROLE"]
# OPS_SERVICE = ["MY_SERVICE_ROLE"]

[features]
llm_model = "claude-sonnet-4-5"           # checked for Cortex access before deploying
pr_sync_task = false                      # sync pull requests every 30 minutes (needs EXECUTE TASK on the account)
# github_integration = "AI_PLATFORM_GITHUB_EAI"   # external access integration for GitHub publishing (an admin creates it)
actual_cost_from_account_usage = false    # read actual Cortex credits (needs SNOWFLAKE.USAGE_VIEWER)

[environment]
# Optional: which environment this deployment is, and where its tables live. QA packs and Data Quality suite files
# can name tables as {{silver}}.SCHEMA.TABLE (or {{domain}}.TABLE for the pack's own domain); these bindings resolve
# them here. Seeded once, when no bindings are saved yet; after that they are edited in Admin, Environments.
# The repository QA packs (domain/<name>/qa/*.sql) use {{silver}}: bind it, or they fail until it is bound.
# DEV binds silver = "DEV_GDP_SILVER_DB" (see README.md, Environment bindings).
# name = "PROD"
# description = "Client production"
# [environment.bindings]
# silver = "PROD_GDP_SILVER_DB"              # a database: {{silver}}.COMPANY.COMPANY_CORE
# landing = "AI_PLATFORM.LANDING"            # or a database and schema: {{landing}}.ORDERS_RAW
